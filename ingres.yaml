apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: todo-ingress

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-service
                port:
                  number: 3000
