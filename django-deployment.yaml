apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-app
  labels:
    app: django-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: django-app

  template:
    metadata:
      labels:
        app: django-app

    spec:
      containers:
        - name: django-app
          image: todo-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: DB_NAME
              value: todo_db

            - name: DB_USER
              value: todo

            - name: DB_PASSWORD
              value: todo

            - name: DB_HOST
              value: postgres-db

            - name: DB_PORT
              value: "5432"
